    // navigation stays same-origin with its initiator and a deduped page

    // document mints the blobs for its OWN frames, obtaining page text

    // text from that direct parent; requests from below are honored only

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 300 500;\n  font-display: swap;\n  src: url(\"9e471853-4ce5-480c-a402-7a56fa726679\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root { color-scheme: dark; }\n  body { margin: 0; background: oklch(0.13 0.005 260); overflow: hidden; }\n  a { color: oklch(0.94 0.005 260); text-decoration: none; border-bottom: 1px solid oklch(0.5 0.005 260); padding-bottom: 2px; }\n  a:hover { border-bottom-color: oklch(0.94 0.005 260); }\n  ::selection { background: oklch(0.4 0.02 260); }\n  html { -webkit-font-smoothing: antialiased; }\n  input, textarea, button { font-family: inherit; }\n  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }\n  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes wordIn { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: blur(0); } }\n  @keyframes bookIn { 0% { opacity: 0; transform: translateY(-26px); } 60% { opacity: 1; transform: translateY(3px); } 100% { opacity: 1; transform: translateY(0); } }\n  @keyframes winPop { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }\n  /* [build.py] Scale the whole phone view up. The wrapper's zoom and\n     height both resolve through --z, so overriding that one property\n     scales everything uniformly — text, photos, shelf — exactly as the\n     desktop zoom does. !important because --z is set in the inline style.\n     The cost is layout width: at 393px an effective 351px is left, which\n     is why the nav metrics below are tuned down to compensate (they still\n     render larger than before, since the zoom scales them back up). */\n  @media (max-width: 760px) {\n    div[data-theme] { --z: 1.12 !important; }\n  }\n  /* [build.py] Phone nav: keep the name on one line. */\n  @media (max-width: 760px) {\n    div[style*='z-index: 20'] { grid-template-columns: auto 1fr !important; }\n    div[style*='z-index: 20'] > a { white-space: nowrap !important; }\n  }\n  /* [build.py] Narrow phones (<=400px): the name plus four tabs no longer\n     fit on one line, so tighten the tab metrics rather than let the row\n     wrap to two lines. */\n  @media (max-width: 400px) {\n    div[style*='z-index: 20'] {\n      font-size: 10.4px !important;\n      letter-spacing: 0.03em !important;\n    }\n    div[style*='z-index: 20'] > a { font-size: 12px !important; }\n    div[style*='z-index: 20'] > span { gap: 6px !important; }\n    /* The phone zoom leaves less layout width, so buy the nav's row back\n       from the gutters instead of shrinking the type any further. */\n    div[style*='z-index: 20'] {\n      padding-left: 12px !important;\n      padding-right: 12px !important;\n    }\n  }\n  /* [build.py] Any title still too long for its spine gets an ellipsis\n     rather than a hard mid-word cut, so it reads as deliberate. */\n  span[style*='vertical-rl'] { text-overflow: ellipsis; }\n  /* [build.py] The sticky panel sits directly under the nav so their bands\n     read as one surface, with no strip of sharp scrolling content between\n     them. The value is in the ZOOMED coordinate space, not screen pixels:\n     the nav measures 56-57 physical px, which under the 1.12 phone zoom is\n     50 CSS px here. Setting the screen figure leaves a 6px seam. Re-measure\n     (and divide by the zoom) if the nav's type or padding changes. Same\n     blur as the nav. */\n  /* [build.py] Phone shelf: the scene panel is a flex item that wraps\n     BELOW the three-row bookshelf, landing ~1030px down — off screen, so\n     you cannot see the stack and the scene you just tapped at the same\n     time. Spines carry a click handler, so pin the panel above the shelf\n     and let it stick while you scroll and tap. The inline top: 200px is a\n     desktop offset and is pure harm here. */\n  @media (max-width: 760px) {\n    div[style*='top: 200px'] {\n      order: -1 !important;\n      position: sticky !important;\n      top: 50px !important;\n      /* Full-bleed across the section's 20px side padding, with the\n         padding added back inside, so the band is a clean opaque strip\n         that fully contains the panel. Otherwise shelf text scrolling\n         past peeks down the sides and just under the tile. */\n      margin: 0 -20px 22px !important;\n      /* 26px, not 16: the cover carries an 18px offset drop-shadow that\n         is not part of its box, so at 16px the grey backing poked 1px\n         past the band's bottom edge and read as misaligned. */\n      padding: 0 20px 26px !important;\n      box-sizing: border-box !important;\n      width: calc(100% + 40px) !important;\n      z-index: 5 !important;\n      /* Fully opaque: at 0.94 the shelf caption ghosted through the band\n         as it scrolled under, which reads as text overlapping the image.\n         Same colour as the page, so at rest the band is invisible. */\n      background: oklch(0.13 0.005 260) !important;\n      backdrop-filter: blur(12px) !important;\n      -webkit-backdrop-filter: blur(12px) !important;\n    }\n    /* The panel's inner row is sized for the desktop column: a 200px tile\n       plus a 26px indent leaves the quote only 96px of a 350px panel, so\n       it gets cut off. Shrink the tile and drop the indent. */\n    div[style*='height: 330px'] {\n      height: auto !important;\n      padding-left: 0 !important;\n      gap: 16px !important;\n    }\n    /* Two shapes appear here: a real cover <img> (225x350 natural, sized\n       300px tall for the desktop column) and, before a spine is picked,\n       a placeholder <div> tile. An earlier rule only matched the div, so\n       the cover kept its full 300px and squeezed the quote into 144px.\n       Size both: height only for the img, so its own aspect ratio is\n       preserved and the art is never squashed or cropped. */\n    div[style*='height: 330px'] > img {\n      height: 235px !important;\n      width: auto !important;\n      max-width: 46% !important;\n      flex: 0 0 auto !important;\n    }\n    div[style*='height: 330px'] > div:first-child {\n      width: 151px !important;\n      height: 235px !important;\n      flex: 0 0 auto !important;\n    }\n    /* The mono caps labels are 9-11px, which is fine on a desktop column\n       and too small to read on a phone. Lift them a step. Keyed off their\n       letter-spacing so book spines — whose size is computed to fit the\n       spine and would re-clip if enlarged — are not matched. */\n    [style*='font-size: 9px'][style*='letter-spacing: 0.22em'] { font-size: 11px !important; }\n    [style*='font-size: 10px'][style*='letter-spacing: 0.08em'] { font-size: 11.5px !important; }\n    [style*='font-size: 11px'][style*='letter-spacing: 0.08em'] { font-size: 12.5px !important; }\n    div[style*='height: 330px'] > div:last-child { padding: 0 4px !important; }\n    /* The card is released by the bottom of its containing block — the\n       shelf row — which ends right above the shelf's caption. That is\n       where it should stop: the caption stays clear and the card is\n       never caught half-scrolled with its cover art sheared by the nav.\n       An earlier revision extended that range by 120px; on a real phone\n       it rode up over the caption and the Recently heading, so it is\n       gone and the natural release point stands. */\n    /* The credit line is nowrap at 0.22em tracking — ~222px of text in a\n       210px column, so it runs off the edge. Let it wrap and tighten. */\n    div[style*='height: 330px'] div[style*='nowrap'] {\n      white-space: normal !important;\n      font-size: 10px !important;\n      letter-spacing: 0.06em !important;\n    }\n  }\n\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-theme=\"{{ theme }}\" style=\"background: oklch(0.13 0.005 260); color: oklch(0.94 0.005 260); font-family: 'Geist', Helvetica, sans-serif; font-size: 16px; line-height: 1.6; --z: clamp(1, calc(100vw / 1280px), 1.35); zoom: var(--z); height: calc(100vh / var(--z)); height: calc(100dvh / var(--z)); overflow: hidden; position: relative;\">\n\n  <div style=\"position: absolute; top: 0; left: 0; right: 0; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline; padding: {{ navPad }}; font-family: 'Geist Mono', monospace; font-size: {{ navFont }}; letter-spacing: 0.07em; color: oklch(0.97 0.003 260 / 0.92); text-shadow: 0 1px 8px oklch(0 0 0 / 0.4); background: {{ navBg }}; backdrop-filter: {{ navBlur }}; -webkit-backdrop-filter: {{ navBlur }};\">\n    <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"color: inherit; border: none; font-weight: 500; justify-self: start; font-size: {{ navNameFont }};\">DARYL ECHEAZU<\u002Fa>\n    <span style=\"display: flex; gap: {{ tabsGap }}; flex-wrap: wrap; justify-content: flex-end;\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <a href=\"#\" sc-camel-on-click=\"{{ t.go }}\" style=\"color: {{ t.color }}; border: none; border-bottom: 1px solid {{ t.underline }}; padding-bottom: 3px; transition: color 0.2s ease, border-bottom-color 0.2s ease;\" style-hover=\"color: oklch(0.97 0.003 260); border-bottom-color: oklch(0.97 0.003 260 / 0.5);\">{{ t.label }}<\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fspan>\n    <span style=\"justify-self: end;\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position: absolute; inset: 0; animation: fadeUp 0.5s ease;\">\n      <img src=\"c6f4a4b8-daaf-47ce-8321-283ab5cd22ea\" alt=\"\" style=\"posit            <button sc-camel-on-click=\"{{ start }}\" style=\"margin-top: 12px; background: transparent; color: oklch(0.90 0.005 260); border: 1px solid oklch(0.36 0.005 260); border-radius: 8px; padding: 8px 18px; font-family: 'Geist Mono', monospace; font-size: 11px; cursor: pointer;\" style-hover=\"border-color: oklch(0.70 0.005 260);\">AGAIN<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ hasZetaRuns }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top: 16px; border-top: 1px solid oklch(0.30 0.005 260 / 0.6); padding-top: 12px;\">\n                    <div style=\"font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: oklch(0.55 0.005 260);\">LEADERBOARD · 120S PACE<\u002Fdiv>\n                    <sc-for list=\"{{ zetaRuns }}\" as=\"zr\" hint-placeholder-count=\"0\">\n                      <div style=\"display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 11.5px; color: {{ zr.color }}; margin-top: 8px;\">\n                        <span>{{ zr.name }}<\u002Fspan><span>{{ zr.score }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ w.isMusic }}\" hint-placeholder-val=\"{{ false }}\">\n                <iframe title=\"Now playing\" src=\"{{ spotifySrc }}\" width=\"100%\" height=\"152\" sc-camel-frame-border=\"0\" allow=\"autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture\" loading=\"lazy\" style=\"display: block; border-radius: 8px;\"><\u002Fiframe>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ w.isWatching }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1.2;\">Frieren<\u002Fdiv>\n                <div style=\"font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 14.5px; color: oklch(0.60 0.005 260); margin-top: 8px;\">one episode at a time, on purpose<\u002Fdiv>\n                <div style=\"font-family: 'Geist Mono', monospace; font-size: 10px; color: oklch(0.52 0.005 260); margin-top: 14px; letter-spacing: 0.06em;\">ALL-TIME: HAJIME NO IPPO<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ w.isTerm }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-family: 'Geist Mono', monospace; font-size: 12.5px; line-height: 1.8; color: oklch(0.85 0.005 260); min-height: 150px; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; justify-content: flex-end;\">\n                  <sc-for list=\"{{ termLines }}\" as=\"tl\" hint-placeholder-count=\"1\">\n                    <div style=\"white-space: pre-wrap; word-break: break-word;\">{{ tl }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 8px; margin-top: 8px; border-top: 1px solid oklch(0.30 0.005 260 / 0.6); padding-top: 10px;\">\n                  <span style=\"font-family: 'Geist Mono', monospace; font-size: 12.5px; color: oklch(0.70 0.17 145);\">❯<\u002Fspan>\n                  <input value=\"{{ termInput }}\" sc-camel-on-change=\"{{ onTermChange }}\" sc-camel-on-key-down=\"{{ onTermKey }}\" sc-camel-auto-complete=\"off\" sc-camel-spell-check=\"false\" placeholder=\"help\" style=\"flex: 1; background: transparent; border: none; color: oklch(0.94 0.005 260); font-family: 'Geist Mono', monospace; font-size: {{ termInputFont }}; outline: none; padding: 2px 0;\">\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ w.isPhotos }}\" hint-placeholder-val=\"{{ false }}\">\n                <img src=\"b0a90455-5649-47f8-81d3-17840998ec88\" alt=\"Mirror Lake, Yosemite\" style=\"display: block; width: 100%; border-radius: 6px;\" draggable=\"false\">\n                <div style=\"font-family: 'Geist Mono', monospace; font-size: 10px; color: oklch(0.55 0.005 260); margin-top: 10px; letter-spacing: 0.06em;\">MIRROR LAKE, YOSEMITE<\u002Fdiv>\n              <\u002Fsc-if>\n\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-for>\n\n      <div style=\"position: {{ dockPos }}; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: oklch(0.15 0.005 260 / 0.6); backdrop-filter: blur(18px); border: 1px solid oklch(0.32 0.005 260 / 0.5); border-radius: 14px; padding: 8px 10px; z-index: 400;\">\n        <sc-for list=\"{{ liveDock }}\" as=\"d\" hint-placeholder-count=\"5\">\n          <div sc-camel-on-click=\"{{ d.open }}\" title=\"{{ d.label }}\" style=\"width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; cursor: pointer; background: {{ d.bg }}; transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);\" style-hover=\"transform: translateY(-6px) scale(1.12);\">{{ d.glyph }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isInbox }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; overflow-y: auto; animation: fadeUp 0.5s ease;\">\n      <div style=\"max-width: 680px; margin: 0 auto; padding: {{ inboxPad }};\">\n        <h2 style=\"font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(38px, 5vw, 60px); margin: 0; line-height: 1.05;\">Write me<em> a note.<\u002Fem><\u002Fh2>\n        <p style=\"margin: 18px 0 0; font-size: 15.5px; color: oklch(0.70 0.005 260); max-width: 48ch; text-wrap: pretty;\">Goes straight to my inbox. Anonymous is fine.<\u002Fp>\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin: 44px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: oklch(0.88 0.005 260);\">Got it. Thanks for writing.<\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ submit }}\" style=\"margin-top: 40px; background: oklch(0.155 0.006 255); border: 1px solid oklch(0.24 0.005 260); border-radius: 4px; padding: 28px 30px 26px; box-shadow: 0 24px 60px oklch(0 0 0 / 0.35);\">\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: oklch(0.55 0.005 260); border-bottom: 1px solid oklch(0.24 0.005 260); padding-bottom: 14px;\">\n              <span>TO: DARYL ECHEAZU — HYDE PARK, CHICAGO<\u002Fspan>\n              <span style=\"white-space: nowrap;\">{{ inboxDate }}<\u002Fspan>\n            <\u002Fdiv>\n            <textarea ref=\"{{ msgRef }}\" name=\"message\" rows=\"6\" placeholder=\"Dear Daryl,\" style=\"display: block; width: 100%; box-sizing: border-box; background: transparent; border: none; color: oklch(0.94 0.005 260); font-family: 'Newsreader', Georgia, serif; font-weight: 300; font-size: 19px; line-height: 32px; padding: 14px 0 0; outline: none; resize: vertical; background-image: repeating-linear-gradient(transparent 0 31px, oklch(0.24 0.005 260) 31px 32px); background-attachment: local;\"><\u002Ftextarea>\n            <div style=\"display: flex; gap: 20px; align-items: baseline; margin-top: 22px;\">\n              <span style=\"font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 17px; color: oklch(0.55 0.005 260); white-space: nowrap;\">— from<\u002Fspan>\n              <input name=\"contact\" placeholder=\"your name, or nothing\" style=\"flex: 1; min-width: 0; background: transparent; border: none; border-bottom: 1px solid oklch(0.28 0.005 260); color: oklch(0.94 0.005 260); font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; padding: 6px 0; outline: none;\" style-focus=\"border-bottom-color: oklch(0.60 0.005 260);\">\n              <button type=\"submit\" style=\"background: oklch(0.94 0.005 260); color: oklch(0.15 0.005 260); border: none; padding: 10px 24px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.12em; cursor: pointer; border-radius: 2px;\" style-hover=\"background: oklch(0.99 0.002 260);\">SEND<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <div style=\"display: flex; gap: 24px; margin-top: 60px; font-family: 'Geist Mono', monospace; font-size: 12px;\">\n          <a href=\"mailto:darecheazu@uchicago.edu\">EMAIL<\u002Fa>\n          <a href=\"https://www.linkedin.com/in/daryl-echeazu/\" target=\"_blank\" rel=\"noreferrer\">LINKEDIN<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;formEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Live data&quot;},&quot;spotifyTrackId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0VjIjW4GlUZAMYd2vXMi3b&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Live data&quot;},&quot;ticktickToken&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Live data&quot;},&quot;instagramUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://www.instagram.com/daryl_echeazu/&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;spotifyProfileUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;}}\">\nclass Compone
