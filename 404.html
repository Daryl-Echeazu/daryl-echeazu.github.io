<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Daryl Echeazu</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#17181c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: oklch(0.13 0.005 260);
    color: oklch(0.94 0.005 260);
    display: grid;
    place-items: center;
    font-family: 'Geist Mono', ui-monospace, monospace;
    text-align: center;
  }
  .code {
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(84px, 18vw, 160px);
    line-height: 1;
    background: linear-gradient(105deg, oklch(0.78 0.14 78),
      oklch(0.94 0.11 95) 50%, oklch(0.82 0.13 85));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .line {
    font-family: 'Newsreader', Georgia, serif;
    font-style: italic;
    font-size: clamp(17px, 2.6vw, 21px);
    color: oklch(0.62 0.005 260);
    margin-top: 14px;
  }
  a {
    display: inline-block;
    margin-top: 34px;
    color: oklch(0.94 0.005 260);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-decoration: none;
    border-bottom: 1px solid oklch(0.78 0.14 78 / 0.7);
    padding-bottom: 3px;
    transition: color 0.25s ease;
  }
  a:hover { color: oklch(0.86 0.13 85); }
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <div class="line">this trail doesn&rsquo;t exist &mdash; not even in Yosemite</div>
    <a href="/">BACK TO BASE CAMP</a>
  </main>
</body>
</html>
